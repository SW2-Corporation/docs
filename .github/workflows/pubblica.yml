name: Pubblicazione

on:
  push:
    branches: [main]
  # ogni notte: stato e giorni usati della pianificazione dipendono dalla data
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Controlli automatici
        run: python strumenti/verifica.py

      - name: Test
        run: python -m unittest discover -s strumenti

      - name: Sito
        run: python strumenti/sito.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
