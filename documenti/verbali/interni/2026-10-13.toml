[[punto]]
titolo = "Presentazione e prima ricognizione dei dieci capitolati d'appalto"
sintesi = """Il gruppo si è riunito telematicamente per passare in rassegna i dieci capitolati d'appalto proposti per l'anno accademico 2026/2027. Ciascun membro ha esposto una prima impressione sui singoli progetti (C0-C9), evidenziando le caratteristiche salienti di ciascun capitolato in termini di dominio applicativo, tipologia di prodotto e tecnologie coinvolte."""

[[punto]]
titolo = "Confronto preliminare su interessi, competenze e aspettative individuali"
sintesi = """È emerso un forte interesse comune per progetti basati su architetture cloud e integrazione di intelligenza artificiale. Al contempo, il gruppo ha espresso riserve su progetti che includono elementi di progettazione hardware in quanto per i membri sarebbe difficile (ove necessario) incontrarsi fisicamente a causa di distanza geografica e disponibilità oraria generalmente diversa."""

[[punto]]
titolo = "Pianificazione delle attività di analisi di dettaglio"
sintesi = """Si è concordato di effettuare una lettura approfondita dei testi dei capitolati in vista della successiva riunione, nella quale verranno definiti i criteri formali di valutazione e selezionate le preferenze primarie per avviare i contatti con i proponenti."""

[[decisione]]
id = "VI-2026-10-13.1"
testo = "Avvio dell'analisi approfondita individuale dei dieci capitolati d'appalto."
motivazione = "Raccogliere elementi conoscitivi puntuali per impostare una valutazione oggettiva e comparativa."

[[decisione]]
id = "VI-2026-10-13.2"
testo = "Convocazione di una nuova riunione interna per il giorno seguente per definire i parametri di valutazione e individuare le prime preferenze."
motivazione = "Rispettare le tempistiche di candidatura e procedere tempestivamente con le richieste di colloquio ai proponenti."

