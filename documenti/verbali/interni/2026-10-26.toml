[[punto]]
titolo = "Scelta definitiva del capitolato"
sintesi = """Il gruppo deve stabilire definitivamente per quale capitolato candidarsi."""

[[punto]]
titolo = "Miglioramento dell'organizzazione delle riunioni"
sintesi = """Il gruppo deve migliorare l'efficienza delle proprie riunioni, al momento organizzate dal Responsabile per ogni settimana."""

[[decisione]]
id = "VI-2026-10-26.1"
testo = "Il gruppo effettuerà la candidatura verso C8 (Halue, Sonar)."
motivazione = "C8 è il miglior capitolato da quanto emerso dall'analisi dei capitolati."

[[decisione]]
id = "VI-2026-10-26.2"
testo = "Ogni membro del gruppo si impegna a identificare e comunicare al Responsabile almeno due fasce orarie in cui è sicuro di essere disponibile ogni settimana. Il Responsabile provvede poi a verificare se vi sono allineamenti favorevoli, con lo scopo di stabilire due orari di riunione fissi durante ogni settimana, modificando le Norme di Progetto attuali."
motivazione = "Avere appuntamenti fissati durante la settimana riduce le necessità organizzative."

