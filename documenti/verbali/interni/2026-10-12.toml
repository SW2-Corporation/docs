[[punto]]
titolo = "Prime impressioni sui capitolati"
sintesi = """Matteo Bellato indica M31 (C4) come il capitolato più convincente tra quelli letti: è chiaro cosa chiede l'azienda, non prevede componenti di intelligenza artificiale e usa tecnologie diffuse e attuali. Davide Baraldo concorda."""

[[punto]]
titolo = "Organizzazione GitHub del gruppo"
sintesi = """Davide Baraldo ha creato un'organizzazione GitHub per il gruppo e chiede a ciascuno l'utente GitHub o l'email per aggiungerlo. L'organizzazione verrà rinominata quando il nome sarà deciso. Matteo Bellato e David Sirbu comunicano il proprio utente."""

[[punto]]
titolo = "Nome del gruppo"
sintesi = """Con il gruppo al completo, Matteo Bellato propone "SW2 Corporation", da leggere come "Software 2", il seguito del software. Davide Baraldo e Alessandro Paduret sono d'accordo; un nome alternativo proposto viene ritirato perché poco adatto ai rapporti con le aziende. Oussama Mahdi approva e il nome passa senza obiezioni."""

[[punto]]
titolo = "Proposte per il logo"
sintesi = """Davide Baraldo presenta nove proposte di logo costruite sul nome scelto; Oussama Mahdi indica come preferita la proposta 7. La scelta del logo resta aperta alla riunione successiva."""

[[decisione]]
id = "VI-2026-10-12.1"
testo = "Il gruppo usa un'organizzazione GitHub comune, creata da Davide Baraldo."
motivazione = "Ospiterà i repository del progetto e ne rende visibile la storia a tutti i membri."

[[decisione]]
id = "VI-2026-10-12.2"
testo = "Il nome del gruppo è SW2 Corporation."
motivazione = "SW2 sta per \"Software 2\", il seguito del software. L'alternativa proposta è stata scartata perché poco adatta ai rapporti con le aziende."

