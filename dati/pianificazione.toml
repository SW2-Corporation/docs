# Pianificazione del progetto: fasi in ordine, ognuna con attività e milestone.
# La legge il sito (pianificazione.html, diagramma di Gantt) e la può leggere ogni documento
# Typst con toml("/dati/pianificazione.toml").
#
# Fasi e attività:
#   inizio, fine                       previsti, obbligatori
#   inizio_effettivo, fine_effettiva   si scrivono quando accadono; senza fine_effettiva è in corso
# Milestone: data prevista, data_effettiva quando è raggiunta.
# Fase: nota e ore_previste facoltative. Le ore usate si sommano da dati/ore.csv,
# con le righe che cadono nel periodo effettivo della fase.
# Le fasi non si sovrappongono: ogni fase inizia dopo la fine della precedente.

